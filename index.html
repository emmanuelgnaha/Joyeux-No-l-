<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joyeux Noël</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Georgia", serif;

    background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.10), transparent 30%),
        linear-gradient(135deg, #071a33, #102f50 55%, #450e19);

    color: white;
}

/* Lumière décorative */
body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: rgba(255,215,100,.08);
    border-radius: 50%;
    filter: blur(80px);
    top: -250px;
    left: 50%;
    transform: translateX(-50%);
}

/* Conteneur */
.container {
    width: 92%;
    max-width: 700px;
    text-align: center;
    position: relative;
    z-index: 2;
}

/* Titre */
.title {
    font-size: clamp(2.3rem, 8vw, 4.5rem);
    font-weight: 500;
    letter-spacing: 3px;
    margin-bottom: 15px;

    text-shadow:
        0 0 10px rgba(255,255,255,.25),
        0 0 35px rgba(255,215,100,.35);
}

.subtitle {
    font-size: 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .75;
    margin-bottom: 70px;
}

/* Enveloppe */
.envelope {
    width: 350px;
    height: 230px;
    position: relative;
    margin: auto;
    cursor: pointer;

    perspective: 1200px;

    filter:
        drop-shadow(0 25px 35px rgba(0,0,0,.45));

    transition: transform .4s ease;
}

.envelope:hover {
    transform: translateY(-8px);
}

/* Corps */
.envelope-body {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(145deg, #c9273c, #8b1022);

    border-radius: 8px;
    overflow: hidden;
}

/* Texture */
.envelope-body::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(135deg,
        transparent 49%,
        rgba(255,255,255,.12) 50%,
        transparent 51%);

    opacity: .8;
}

/* Lettre */
.letter {
    position: absolute;

    width: 88%;
    height: 190px;

    left: 6%;
    top: 18px;

    background:
        linear-gradient(135deg, #fffef9, #f5efe2);

    color: #8c1828;

    border-radius: 5px;

    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);

    transition:
        transform 1.1s cubic-bezier(.2,.8,.2,1);
}

.letter h2 {
    font-size: 1.8rem;
    font-weight: 500;
    letter-spacing: 2px;

    text-shadow:
        0 1px 1px rgba(0,0,0,.08);
}

/* Rabat de l'enveloppe */
.flap {
    position: absolute;

    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left: 175px solid transparent;
    border-right: 175px solid transparent;
    border-top: 130px solid #e03449;

    transform-origin: top;

    transition:
        transform 1.1s cubic-bezier(.2,.8,.2,1);

    z-index: 4;
}

/* Partie inférieure */
.envelope::after {
    content: "";

    position: absolute;

    bottom: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left: 175px solid transparent;
    border-right: 175px solid transparent;
    border-bottom: 125px solid #a7162b;

    z-index: 3;
}

/* Ouverture */
.envelope.open .flap {
    transform: rotateX(180deg);
    z-index: 1;
}

.envelope.open .letter {
    transform: translateY(-155px);
    z-index: 5;
}

/* Instruction */
.instruction {
    margin-top: 75px;

    font-size: .85rem;
    letter-spacing: 1.5px;

    opacity: .65;

    text-transform: uppercase;
}

/* Étoiles */
.star {
    position: fixed;
    color: #fff;
    opacity: .7;

    animation:
        twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: .2;
        transform: scale(.8);
    }

    to {
        opacity: 1;
        transform: scale(1.2);
    }
}

/* Flocons */
.snow {
    position: fixed;
    top: -30px;

    color: white;
    opacity: .7;

    pointer-events: none;

    animation:
        snowfall linear infinite;
}

@keyframes snowfall {
    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }
}

/* Mobile */
@media (max-width: 500px) {

    .title {
        font-size: 2.3rem;
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: .75rem;
        margin-bottom: 55px;
    }

    .envelope {
        width: 290px;
        height: 190px;
    }

    .flap {
        border-left-width: 145px;
        border-right-width: 145px;
        border-top-width: 108px;
    }

    .envelope::after {
        border-left-width: 145px;
        border-right-width: 145px;
        border-bottom-width: 105px;
    }

    .letter {
        height: 155px;
    }

    .letter h2 {
        font-size: 1.35rem;
    }

    .envelope.open .letter {
        transform: translateY(-125px);
    }

    .instruction {
        margin-top: 60px;
        font-size: .7rem;
    }
}
</style>
</head>

<body>

<!-- Étoiles -->
<div class="star" style="top:10%;left:8%;font-size:14px;">✦</div>
<div class="star" style="top:18%;left:88%;font-size:18px;">✦</div>
<div class="star" style="top:35%;left:15%;font-size:11px;">✧</div>
<div class="star" style="top:12%;left:60%;font-size:13px;">✦</div>
<div class="star" style="top:65%;left:92%;font-size:15px;">✧</div>
<div class="star" style="top:75%;left:7%;font-size:12px;">✦</div>

<!-- Neige -->
<div class="snow" style="left:5%;font-size:14px;animation-duration:9s;">❄</div>
<div class="snow" style="left:17%;font-size:18px;animation-duration:12s;">❄</div>
<div class="snow" style="left:30%;font-size:12px;animation-duration:8s;">❄</div>
<div class="snow" style="left:45%;font-size:17px;animation-duration:11s;">❄</div>
<div class="snow" style="left:60%;font-size:13px;animation-duration:9s;">❄</div>
<div class="snow" style="left:75%;font-size:18px;animation-duration:13s;">❄</div>
<div class="snow" style="left:90%;font-size:14px;animation-duration:10s;">❄</div>

<div class="container">

    <h1 class="title">
        🎄 Joyeux Noël 🎄
    </h1>

    <div class="subtitle">
        Une attention spéciale
    </div>

    <div
        class="envelope"
        id="envelope"
        onclick="ouvrirEnveloppe()"
    >

        <div class="envelope-body"></div>

        <!-- MESSAGE -->
        <div class="letter">
            <h2>🎄 Joyeux Noël 🎄</h2>
        </div>

        <div class="flap"></div>

    </div>

    <div class="instruction">
        Cliquez sur l’enveloppe
    </div>

</div>

<script>

function ouvrirEnveloppe() {

    const envelope =
        document.getElementById("envelope");

    envelope.classList.toggle("open");

}

</script>

</body>
</html>
